<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HBD MAK</title>
<style>
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; padding:24px;
    background:linear-gradient(160deg,#ffd6ef,#f3c9ff  60%,#fff0fa);
    font-family:"Segoe UI",system-ui,sans-serif;
    text-align:center; overflow-x:hidden;
  }

  /* ===== GREETING (EDIT THESE) ===== */
  h1 { margin:0; font-size:clamp(26px,7vw,46px); color:#d14d8b; text-shadow:0 2px 0 #fff; }
  .subtitle { margin:0; font-size:clamp(14px,4vw,20px); color:#7a5c8e; }
  .hint { font-size:13px; color:#9a8aa5; margin-top:-4px; }

  /* ===== CAKE ===== */
  .cake { position:relative; width:240px; height:150px; margin-top:10px; }
  .plate  { position:absolute; bottom:0; left:-15px; width:270px; height:22px; background:#dcdce6; border-radius:50%; }
  .bottom { position:absolute; left:0;  bottom:18px; width:240px; height:60px; background:#ff9ac1; border-radius:14px 14px 8px 8px; }
  .top    { position:absolute; left:30px; bottom:72px; width:180px; height:46px; background:#ffc3dd; border-radius:14px; }
  .frosting { position:absolute; left:30px; bottom:74px; width:180px; height:16px; background:#fff; border-radius:0 0 12px 12px; }

  .candles { position:absolute; bottom:112px; left:50%; transform:translateX(-50%); display:flex; gap:22px; }
  .candle {
    position:relative; width:8px; height:30px;
    background:repeating-linear-gradient(45deg,#ff6b6b 0 6px,#fff 6px 12px);
    border-radius:3px; cursor:pointer;
  }
  .flame {
    position:absolute; top:-16px; left:50%; transform:translateX(-50%);
    width:12px; height:18px;
    background:radial-gradient(circle at 50% 70%,#fff3b0,#ffae00 60%,#ff5e00);
    border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
    animation:flicker .25s infinite alternate;
  }
  @keyframes flicker {
    from { transform:translateX(-50%) scale(1)    rotate(-2deg); opacity:1;  }
    to   { transform:translateX(-50%) scale(1.08) rotate(2deg);  opacity:.85;}
  }
  .candle.out .flame { opacity:0 !important; animation:none; }
  .candle.out::after {
    content:""; position:absolute; top:-18px; left:50%;
    width:4px; height:4px; background:#bbb; border-radius:50%;
    animation:smoke 1.2s ease-out forwards;
  }
  @keyframes smoke {
    from { transform:translate(-50%,0) scale(1); opacity:.6; }
    to   { transform:translate(-50%,-40px) scale(2.5); opacity:0; }
  }

  .wish { font-size:clamp(16px,5vw,24px); color:#d14d8b; font-weight:bold;
          opacity:0; transform:scale(.8); transition:all .5s; }
  .wish.show { opacity:1; transform:scale(1); }

  /* ===== DOGS ===== */
  .pack {
    display:flex; align-items:flex-end; justify-content:center;
    gap:6px; flex-wrap:wrap; margin-top:8px;
    min-height:60px;              /* reserve space so the row doesn't jump as dogs appear */
  }
  /* dogs start HIDDEN and slightly down + shrunk */
  .dog {
    position:relative; width:52px; height:46px;
    opacity:0; transform:translateY(16px) scale(.4);
    transition:opacity .4s, transform .4s cubic-bezier(.34,1.56,.64,1); /* springy pop */
    pointer-events:none;
  }
  /* once revealed: visible + hopping like before */
  .dog.show {
    opacity:1; transform:translateY(0) scale(1);
    animation:hop 2s ease-in-out infinite;
  }
  .dog .body { position:absolute; bottom:0; left:6px; width:40px; height:28px; border-radius:16px; }
  .dog .head { position:absolute; bottom:16px; left:0;  width:26px; height:24px; border-radius:50%; }
  .dog .ear  { position:absolute; bottom:30px; left:2px; width:10px; height:16px; border-radius:50% 50% 40% 40%; }
  .dog .ear.r{ left:16px; }
  .dog .eye  { position:absolute; bottom:26px; left:6px; width:3px; height:3px; background:#222; border-radius:50%; }
  .dog .eye.r{ left:14px; }
  .dog .nose { position:absolute; bottom:21px; left:9px; width:5px; height:4px; background:#222; border-radius:50%; }
  .dog .tail { position:absolute; bottom:14px; right:2px; width:12px; height:6px; border-radius:4px; transform-origin:left center; }
  .dog.show .tail { animation:wag .4s infinite alternate; }
  @keyframes hop { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  @keyframes wag { from{transform:rotate(-20deg)} to{transform:rotate(20deg)} }

  /* ---- DOG COLORS ---- */
  .black .body,.black .head,.black .ear,.black .tail { background:#333; }
  .black .eye,.black .eye.r { background:#eee; }
  .brown .body,.brown .head,.brown .ear,.brown .tail { background:#9c6b3f; }
  .white-black .body,.white-black .head,.white-black .ear,.white-black .tail { background:#f3f3f3; }
  .white-black .spot { position:absolute; background:#333; border-radius:50%; }
  .white-black .spot.a{ bottom:4px; left:14px; width:12px; height:12px; }
  .white-black .spot.b{ bottom:18px; left:2px;  width:7px;  height:7px;  }
  .white-brown .body,.white-brown .head,.white-brown .ear,.white-brown .tail { background:#f6f3ef; }
  .white-brown .spot { position:absolute; background:#9c6b3f; border-radius:50%; }
  .white-brown .spot.a{ bottom:4px; left:12px; width:13px; height:13px; }
  .white-brown .spot.b{ bottom:30px;left:4px;  width:6px;  height:6px;  }
  .golden { width:62px; height:52px; }
  .golden .body,.golden .head,.golden .tail { background:#e3b36b; }
  .golden .body{ width:46px; height:30px; }
  .golden .head{ width:28px; height:26px; }
  .golden .ear { background:#caa05a; width:12px; height:22px; border-radius:50% 50% 60% 60%; bottom:24px; }
  .golden .ear.r{ left:18px; }
</style>
</head>
<body>

  <!-- ===== EDIT: the greeting ===== -->
  <h1>Happy Birthday, Mom!</h1>
  <p class="subtitle">Selamat bertambah umur lope u</p>
  <p class="hint">(blow out the candles)</p>

  <!-- ===== CAKE ===== -->
  <div class="cake">
    <div class="plate"></div>
    <div class="bottom"></div>
    <div class="top"></div>
    <div class="frosting"></div>
    <div class="candles">
      <div class="candle"><div class="flame"></div></div>
      <div class="candle"><div class="flame"></div></div>
      <div class="candle"><div class="flame"></div></div>
      <div class="candle"><div class="flame"></div></div>
      <div class="candle"><div class="flame"></div></div>
    </div>
  </div>

  <p class="wish">Make a wish! 💛</p>

  <!-- ===== THE 5 DOGS (start hidden) ===== -->
  <div class="pack">
    <div class="dog black">
      <div class="body"></div><div class="head"></div>
      <div class="ear"></div><div class="ear r"></div>
      <div class="eye"></div><div class="eye r"></div>
      <div class="nose"></div><div class="tail"></div>
    </div>
    <div class="dog brown">
      <div class="body"></div><div class="head"></div>
      <div class="ear"></div><div class="ear r"></div>
      <div class="eye"></div><div class="eye r"></div>
      <div class="nose"></div><div class="tail"></div>
    </div>
    <div class="dog white-black">
      <div class="body"></div><div class="head"></div>
      <div class="ear"></div><div class="ear r"></div>
      <div class="eye"></div><div class="eye r"></div>
      <div class="nose"></div><div class="tail"></div>
      <div class="spot a"></div><div class="spot b"></div>
    </div>
    <div class="dog white-brown">
      <div class="body"></div><div class="head"></div>
      <div class="ear"></div><div class="ear r"></div>
      <div class="eye"></div><div class="eye r"></div>
      <div class="nose"></div><div class="tail"></div>
      <div class="spot a"></div><div class="spot b"></div>
    </div>
    <div class="dog golden">
      <div class="body"></div><div class="head"></div>
      <div class="ear"></div><div class="ear r"></div>
      <div class="eye"></div><div class="eye r"></div>
      <div class="nose"></div><div class="tail"></div>
    </div>
  </div>

<script>
  const candles = document.querySelectorAll('.candle');
  const dogs    = document.querySelectorAll('.dog');
  const wish    = document.querySelector('.wish');
  let revealed  = 0;   // how many dogs we've shown so far

  candles.forEach(candle => {
    candle.addEventListener('click', () => {
      if (candle.classList.contains('out')) return; // ignore re-clicks on an out candle
      candle.classList.add('out');

      // reveal the NEXT hidden dog
      if (dogs[revealed]) {
        dogs[revealed].classList.add('show');
        revealed++;
      }

      // when all candles are out, show the wish
      const allOut = [...candles].every(c => c.classList.contains('out'));
      if (allOut) setTimeout(() => wish.classList.add('show'), 400);
    });
  });
</script>
</body>
</html>
